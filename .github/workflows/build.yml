name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Eksik Android iskelet dosyalarını üretir; repodaki dosyaların üzerine yazmaz.
      - name: Android iskeletini oluştur
        run: flutter create . --org com.furkanvarol --project-name koridor --platforms android

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: koridor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
